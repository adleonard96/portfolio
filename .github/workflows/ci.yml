name: Build

on: 
  pull_request:
    branches:
      - main

jobs:
  Lint-Build:
    name: Lint Code
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # - name: Run linters
      #   uses: super-linter/super-linter@v7.1.0          
      #   env:
      #     #DEFAULT_BRANCH: main
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      
        
